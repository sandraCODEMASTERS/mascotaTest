<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro mascota | MascotasTest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="contenedor">
      <div class="marca">
        <div class="logo">MT</div>
        <div>
          <h1>MascotasTest</h1>
          <span>Alcaldia de la ciudad</span>
        </div>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="registro.html">Registro</a></li>
          <li><a href="servicios.html">Servicios</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="centrado">
    <div class="tarjeta">
      <h2 style="border:none; padding:0; margin-bottom:6px;">Registrar mascota</h2>
      <p class="parrafo">Registra un perro o un gato para poder inscribirlo en las jornadas.</p>

      <form action="#" method="post">
        <div class="campo">
          <label for="nombre">Nombre de la mascota</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Firulais" required>
        </div>

        <div class="campo">
          <label for="especie">Especie</label>
          <select id="especie" name="especie" required>
            <option value="">Seleccione una especie</option>
            <option value="perro">Perro</option>
            <option value="gato">Gato</option>
          </select>
        </div>

        <div class="campo">
          <label for="raza">Raza</label>
          <input type="text" id="raza" name="raza" placeholder="Ej: Criollo" required>
        </div>

        <button type="submit" class="boton bloque">Registrar mascota</button>
      </form>

      <p class="enlace-centro">
        <a href="mis-mascotas.html">Ver mis mascotas</a>
      </p>
    </div>
  </main>

  <footer>
    <div class="contenedor">
      <strong>MascotasTest</strong> - Proyecto academico SENA |
      Aplicacion web HTML, CSS y PHP para XAMPP
    </div>
  </footer>

</body>
</html>
